name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Android platform 36 and build-tools 36.0.0
        # The runner image ships the Android SDK (ANDROID_HOME); add what the build needs.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: The tag matches the app's version
        run: |
          version=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' AndroidManifest.xml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $version" >&2
            exit 1
          fi
      - name: Host tests
        run: python3 tools/test.py
      - name: Release APK
        env:
          PRISM_KEYSTORE_BASE64: ${{ secrets.PRISM_KEYSTORE_BASE64 }}
          PRISM_KEYSTORE_PASSWORD: ${{ secrets.PRISM_KEYSTORE_PASSWORD }}
          PRISM_KEY_ALIAS: ${{ secrets.PRISM_KEY_ALIAS }}
          PRISM_KEY_PASSWORD: ${{ secrets.PRISM_KEY_PASSWORD }}
        run: |
          export PRISM_KEYSTORE="$RUNNER_TEMP/prism.jks"
          printf '%s' "$PRISM_KEYSTORE_BASE64" | base64 --decode > "$PRISM_KEYSTORE"
          python3 tools/build.py --release
          rm -f "$PRISM_KEYSTORE"
      - uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          name: Prism ${{ github.ref_name }}
          files: |
            build/prism-*.apk
            build/SHA256SUMS
          fail_on_unmatched_files: true
